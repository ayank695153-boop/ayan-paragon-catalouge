<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayan Licence Admin</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui;padding:20px}.wrap{max-width:720px;margin:auto}.card{background:#121a2c;border:1px solid #2a3550;border-radius:18px;padding:18px;margin:14px 0}input,button{width:100%;height:48px;margin:6px 0;border-radius:12px;border:1px solid #34415e;background:#0d1424;color:#fff;padding:0 14px;font-size:16px}button{background:#2f6df6;border:0;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lic{padding:12px 0;border-top:1px solid #29334a}.muted{color:#9ba6bd;font-size:13px}.danger{background:#8b3144}.good{background:#236b4b}</style></head><body><div class="wrap"><h1>Ayan Licence Admin</h1><div class="card"><input id="token" placeholder="Admin token" type="password"><button onclick="load()">Load licences</button></div><div class="card"><h2>Create licence</h2><input id="key" placeholder="Optional custom key"><input id="days" type="number" value="30" min="1" placeholder="Days"><input id="note" placeholder="Customer / note"><button onclick="create()">Create licence</button><div id="out"></div></div><div class="card"><h2>Licences</h2><div id="list" class="muted">Enter admin token and load.</div></div></div><script>const $=x=>document.getElementById(x);async function req(url,opts={}){opts.headers={...(opts.headers||{}),'x-admin-token':$('token').value,'Content-Type':'application/json'};let r=await fetch(url,opts),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}async function load(){try{let d=await req('/api/admin/licenses');$('list').innerHTML=d.licenses.map(l=>`<div class="lic"><b>${l.key}</b><div class="muted">${l.note||''} • ${l.blocked?'BLOCKED':'ACTIVE'} • ${l.expiresAt?new Date(l.expiresAt).toLocaleString():'No expiry'}</div><div class="row"><button onclick="act('${l.key}','${l.blocked?'unblock':'block'}')">${l.blocked?'Unblock':'Block'}</button><button onclick="act('${l.key}','reset-device')">Reset device</button></div></div>`).join('')||'No licences'}catch(e){$('list').textContent=e.message}}async function create(){try{let d=await req('/api/admin/licenses',{method:'POST',body:JSON.stringify({key:$('key').value,days:$('days').value,note:$('note').value})});$('out').innerHTML='<b>Created:</b> '+d.license.key;load()}catch(e){$('out').textContent=e.message}}async function act(k,a){await req('/api/admin/licenses/'+encodeURIComponent(k)+'/'+a,{method:'POST'});load()}</script></body></html>
